spring.application.name=issueflow
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/issueflow?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:issueflow}
spring.datasource.password=${DB_PASSWORD:issueflow_dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false
